<header class="site-header">
    <div class="container">
        <div class="header-inner">
            <a class="site-title" rel="author" href="{{ '/' | relative_url }}">{{ site.title }}</a>
            <div class="nav-actions">
                <button class="search-toggle" aria-label="Search" onclick="document.getElementById('search-modal').classList.add('show')">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>

                <!-- Notification Center -->
                <div class="notif-container">
                    <button id="notif-bell" class="notif-toggle" aria-label="Notifications">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                        <span id="notif-badge" class="notif-badge" style="display: none;">0</span>
                    </button>
                    <div id="notif-panel" class="notif-panel glassmorphism">
                        <div class="notif-header">
                            <h3>Recent Publications</h3>
                            <button id="notif-mark-read" class="notif-mark-read" aria-label="Mark all as read">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 7 17l-5-5"></path><path d="m22 10-7.5 7.5L13 16"></path></svg>
                            </button>
                        </div>
                        <div id="notif-list" class="notif-list">
                            <div class="notif-empty">
                                <div class="empty-icon">📭</div>
                                <p>Loading...</p>
                            </div>
                        </div>
                        <div class="notif-footer">
                            <a href="{{ '/' | relative_url }}" class="notif-view-all">View all articles &rarr;</a>
                        </div>
                    </div>
                </div>

                <a id="auth-btn" href="#" class="btn btn-primary" onclick="openAuthPopup(event)">Sign In</a>

                <button class="mobile-menu-toggle" aria-label="Menu" onclick="document.querySelector('.nav-links').classList.toggle('show')">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
            </div>
            <nav class="site-nav" id="site-nav">
                <ul class="nav-list">
                    <li><a href="{{ '/' | relative_url }}" class="page-link">Home</a></li>
                    <li><a href="{{ '/archive' | relative_url }}" class="page-link">Archive</a></li>
                    <li class="nav-has-children">
                        <span class="page-link">Topics</span>
                        <ul class="sub-menu">
                            <li><a href="{{ '/category/tech' | relative_url }}">Tech</a></li>
                            <li><a href="{{ '/category/news' | relative_url }}">News</a></li>
                            <li><a href="{{ '/category/geopolitics' | relative_url }}">Geopolitics</a></li>
                        </ul>
                    </li>
                    <li><a href="{{ '/about' | relative_url }}" class="page-link">About</a></li>
                    <li><a href="{{ '/contact' | relative_url }}" class="page-link">Contact</a></li>
                    <li class="nav-auth-item">
                        <a href="{{ '/login' | relative_url }}" class="page-link auth-link logged-out-show">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        </a>
                        <a href="{{ '/profile' | relative_url }}" class="page-link auth-link logged-in-show" style="display: none;">
                            <img id="fb-user-avatar" src="" alt="Profile" class="nav-avatar">
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

    <div class="search-overlay" id="search-overlay">
        <div class="container">
            <div class="search-container">
                <input type="text" id="search-input" class="search-input" placeholder="Search posts..." aria-label="Search posts">
                <button class="close-search" onclick="toggleSearch()" aria-label="Close search">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <ul id="search-results" class="search-results"></ul>
        </div>
    </div>
</header>
