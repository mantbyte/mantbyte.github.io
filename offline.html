sitemap: false
---
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | mantbyte</title>
    <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #0a0a0a;
            color: #e5e5e5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        .offline-container {
            max-width: 480px;
        }

        .offline-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: #ffffff;
        }

        p {
            font-size: 1rem;
            line-height: 1.6;
            color: #888;
            margin-bottom: 2rem;
        }

        .retry-btn {
            display: inline-block;
            padding: 0.75rem 2rem;
            background: #0f4c81;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .retry-btn:hover {
            background: #1a6bb5;
            transform: translateY(-2px);
        }

        .cached-pages {
            margin-top: 2.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #222;
        }

        .cached-pages h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #666;
            margin-bottom: 1rem;
        }

        #cached-list {
            list-style: none;
            padding: 0;
        }

        #cached-list li {
            margin-bottom: 0.5rem;
        }

        #cached-list a {
            color: #4a9eed;
            text-decoration: none;
            font-size: 0.9rem;
        }

        #cached-list a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">📡</div>
        <h1>You're Offline</h1>
        <p>It looks like you've lost your internet connection. Don't worry — some pages you've visited before may still be available below.</p>
        <button class="retry-btn" onclick="window.location.reload()">Try Again</button>

        <div class="cached-pages">
            <h3>Previously Viewed Pages</h3>
            <ul id="cached-list">
                <li><a href="/">Home</a></li>
            </ul>
        </div>
    </div>

    <script>
        // Show cached pages
        if ('caches' in window) {
            caches.open('mantbyte-v1').then(cache => {
                cache.keys().then(requests => {
                    const list = document.getElementById('cached-list');
                    const seen = new Set(['/']);
                    requests.forEach(req => {
                        const url = new URL(req.url);
                        const path = url.pathname;
                        // Only show HTML pages, not assets
                        if (!seen.has(path) && !path.includes('/assets/') && !path.includes('/icons/') && path !== '/offline.html' && !path.endsWith('.json') && !path.endsWith('.xml') && !path.endsWith('.js')) {
                            seen.add(path);
                            const name = path.replace(/\/$/, '').split('/').pop() || 'Home';
                            const displayName = name.replace(/-/g, ' ').replace(/\.html$/, '');
                            const li = document.createElement('li');
                            li.innerHTML = `<a href="${path}">${displayName.charAt(0).toUpperCase() + displayName.slice(1)}</a>`;
                            list.appendChild(li);
                        }
                    });
                });
            });
        }
    </script>
</body>
</html>
