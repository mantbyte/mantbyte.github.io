# GitHub Actions: Build and Deploy mantbytes to GitHub Pages
# This workflow runs automatically when you push to the main branch.
# It builds the Jekyll site and deploys it to GitHub Pages — no manual setup needed.

name: Deploy mantbytes

on:
  push:
    branches: ["main"]
  workflow_dispatch:  # Allows you to manually trigger from GitHub Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Setup Python
        if: success()
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '_automation/requirements.txt'

      - name: Install dependencies
        if: success()
        run: pip install -r _automation/requirements.txt

      - name: Run Distribution Engine
        if: success()
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FCM_VAPID_KEY: ${{ secrets.FCM_VAPID_KEY }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
        run: |
          cd ${{ github.workspace }}
          if [ -f "_automation/distribution_event.json" ]; then
            echo "Found distribution event, running engine..."
            python _automation/distribution/engine.py

            # Clean up the event file so it doesn't trigger again on subsequent random deploys
            # We don't commit this deletion because it's just in the GH Actions runner workspace
            rm _automation/distribution_event.json
          else
            echo "No distribution event found. Skipping notification distribution."
          fi
