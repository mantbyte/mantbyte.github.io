# GitHub Actions: Build and Deploy mantbytes to GitHub Pages
# This workflow runs automatically when you push to the main branch.
# It builds the Jekyll site and deploys it to GitHub Pages — no manual setup needed.

name: Deploy mantbytes

on:
  push:
    branches: ["main"]
  workflow_dispatch:  # Allows you to manually trigger from GitHub Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  distribute:
    name: Run Distribution Engine
    if: ${{ needs.deploy.result == 'success' && github.event_name == 'push' }}
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '_automation/requirements.txt'

      - name: Install dependencies
        run: pip install -r _automation/requirements.txt

      - name: Debug Secret Injection
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "❌ GITHUB ACTIONS BUG: The secret is completely empty when injected!"
          else
            echo "✅ The secret is successfully injected into the bash environment. Length: ${#FIREBASE_SERVICE_ACCOUNT}"
          fi

      - name: Generate events and run Distribution Engine
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FCM_VAPID_KEY: ${{ secrets.FCM_VAPID_KEY }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
        run: |
          cd ${{ github.workspace }}
          set -euo pipefail

          event_dir="$(mktemp -d "${RUNNER_TEMP}/mantbyte-events.XXXXXX")"
          trap 'rm -rf "$event_dir"' EXIT

          python _automation/distribution/event_generator.py \
            --before "$BEFORE_SHA" \
            --after "$AFTER_SHA" \
            --output-dir "$event_dir"

          mapfile -t event_files < <(
            find "$event_dir" -maxdepth 1 -type f -name 'event-*.json' -print | sort
          )

          if [ "${#event_files[@]}" -eq 0 ]; then
            echo "No newly added posts detected. Skipping notification distribution."
            exit 0
          fi

          for event_file in "${event_files[@]}"; do
            echo "Running Distribution Engine for ${event_file}..."
            python _automation/distribution/engine.py --event "$event_file"
          done
