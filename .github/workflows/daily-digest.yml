# Mantbyte Daily Digest
# Compiles and sends the daily newsletter digest via SMTP

name: Daily Digest Distribution

on:
  schedule:
    - cron: '30 2 * * *'   # 02:30 UTC = 08:00 IST every day
  workflow_dispatch:         # Manual trigger

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '_automation/requirements.txt'

      - name: Install dependencies
        run: pip install -r _automation/requirements.txt

      - name: Send Verifications and Daily Digest
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FCM_VAPID_KEY: ${{ secrets.FCM_VAPID_KEY }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          DIST_ENABLE_EMAIL: "true"
          DIST_ENABLE_DIGEST: "true"
        run: |
          cd ${{ github.workspace }}
          python _automation/distribution/engine.py --verify
          python _automation/distribution/engine.py --digest
