name: Daily DSA Pipeline

on:
  schedule:
    # Run at 10:00 AM UTC every day
    - cron: '0 10 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Need write permission to push commits

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '_automation/requirements.txt'

      - name: Install dependencies
        run: pip install -r _automation/requirements.txt

      - name: Run Daily DSA Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
        run: |
          python _automation/daily_dsa.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Check if there are any changes (new post, updated history)
          if [[ -n $(git status -s) ]]; then
            git add _posts/ _data/ assets/images/posts/
            git commit -m "auto: add daily DSA problem"
            git push origin main
          else
            echo "No changes to commit."
          fi
