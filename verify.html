---
layout: default
title: "Verify your subscription"
---
<div class="container" style="max-width: 600px; margin: 6rem auto; text-align: center; min-height: 50vh;">
    <div class="glassmorphism" style="padding: 3rem; border-radius: 12px;">
        <h1 id="verify-title">Verifying...</h1>
        <p id="verify-message">Please wait while we confirm your subscription.</p>
        <div id="verify-action" style="margin-top: 2rem; display: none;">
            <a href="{{ '/' | relative_url }}" class="btn btn-primary">Return to Homepage</a>
        </div>
    </div>
</div>

<script type="module">
import { db } from '{{ "/assets/js/firebase/firebase-init.js" | relative_url }}';
import { doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

document.addEventListener('DOMContentLoaded', async () => {
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const action = urlParams.get('action'); // "unsubscribe" if they clicked the unsubscribe link

    const titleEl = document.getElementById('verify-title');
    const msgEl = document.getElementById('verify-message');
    const actionEl = document.getElementById('verify-action');

    if (!token && action !== 'unsubscribe') {
        showError("Invalid verification link. Missing token.");
        return;
    }

    try {
        if (!token) {
            showError("Invalid verification link. Missing token.");
            return;
        }

        const subscriberRef = doc(db, 'subscribers', token);

        if (action === 'unsubscribe') {
            await updateDoc(subscriberRef, { is_active: false });
            titleEl.textContent = "Unsubscribed";
            msgEl.textContent = "You have been successfully unsubscribed from the Mantbyte newsletter.";
        } else {
            await updateDoc(subscriberRef, { verified: true });
            titleEl.textContent = "Subscription Confirmed!";
            msgEl.textContent = "Thank you for verifying your email. You will now receive new articles directly in your inbox.";
        }
        actionEl.style.display = 'block';
    } catch (error) {
        console.error("Verification error:", error);
        showError("An error occurred during verification. Please try again later.");
    }

    function showError(msg) {
        titleEl.textContent = "Verification Failed";
        msgEl.textContent = msg;
        actionEl.style.display = 'block';
    }
});
</script>
